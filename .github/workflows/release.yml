name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    # Darwin targets must be built and codesigned on macOS (spec §6); the
    # linux musl target cross-compiles from the same runner.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - name: Version pins must equal the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(jq -r .version package.json)"
          if [ "$PKG" != "$TAG" ]; then
            echo "package.json version ($PKG) != tag ($TAG)" >&2
            exit 1
          fi
          if [ -f .claude-plugin/plugin.json ]; then
            PLUGIN="$(jq -r .version .claude-plugin/plugin.json)"
            if [ "$PLUGIN" != "$TAG" ]; then
              echo "plugin.json version ($PLUGIN) != tag ($TAG)" >&2
              exit 1
            fi
          fi

      - run: bun test
      - run: bunx tsc --noEmit
      - run: bash scripts/build.sh

      - name: Ad-hoc codesign darwin binaries
        run: |
          for bin in dist/claude-visor-darwin-arm64 dist/claude-visor-darwin-x64; do
            codesign --force -s - "$bin"
            codesign --verify --strict "$bin"
            codesign -dv "$bin" 2>&1 | grep -q "Signature=adhoc"
          done

      - name: Package tarballs and SHA256SUMS
        run: |
          mkdir -p artifacts
          for entry in darwin-arm64:darwin-arm64 darwin-x64:darwin-x64 linux-x64-musl-baseline:linux-x64; do
            target="${entry%%:*}"; platform="${entry##*:}"
            mkdir -p "pkg/$platform"
            cp "dist/claude-visor-$target" "pkg/$platform/claude-visor"
            tar -czf "artifacts/claude-visor-$platform.tar.gz" -C "pkg/$platform" claude-visor
          done
          (cd artifacts && shasum -a 256 *.tar.gz > SHA256SUMS)

      - name: Verify checksums against the tarballs
        run: cd artifacts && shasum -a 256 -c SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRERELEASE=""
          case "$GITHUB_REF_NAME" in v0.0.*) PRERELEASE="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" artifacts/*.tar.gz artifacts/SHA256SUMS \
            --title "$GITHUB_REF_NAME" --generate-notes $PRERELEASE

      - name: Sync bundled checksums with the release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          mkdir -p checksums
          cp artifacts/SHA256SUMS checksums/SHA256SUMS
          git add checksums/SHA256SUMS
          git commit -m "Sync SHA256SUMS for $GITHUB_REF_NAME" || exit 0
          git push origin main
